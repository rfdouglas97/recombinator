# Daily YC Launches monitor
# Docs: https://docs.github.com/en/actions
#
# Runs every day at 14:00 UTC (6:00 AM Pacific during PDT).
# Also trigger manually: Actions tab → "Daily launch check" → Run workflow

name: Daily launch check

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-launches:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run launch check
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: node scripts/check-launches.mjs --ingest

      - name: Refresh normalized assignments + explorer bundle
        run: |
          node normalize-verticals.mjs --write
          node scripts/build-explorer-data.mjs

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check-${{ github.run_id }}
          path: |
            output/launches/check-report.json
            output/launches/reviews.json
            output/launches/rubric.md
          retention-days: 90

      - name: Commit launch results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/launches/ output/verticals/normalized-assignments.json output/phenotypes/assignments.json explorer/public/data.bundle.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$(cat <<'EOF'
chore: daily launch check results

Automated update from GitHub Actions launch monitor.
EOF
)"
            git push
          fi
