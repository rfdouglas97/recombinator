# Daily YC Launches monitor
# Docs: https://docs.github.com/en/actions
#
# Schedule: every day at 14:00 UTC (~6:00 AM Pacific during PDT).
# Manual run: Actions → "Daily launch check" → Run workflow
#
# Setup (once): GitHub repo → Settings → Secrets → Actions
#   DATABASE_URL — Supabase session pooler URI (?sslmode=require). See db/DEPLOY.md.
#   ANTHROPIC_API_KEY — required for LLM phenotype + vertical classification on new launches.

name: Daily launch check

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  check-launches:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install chromium --with-deps

      - name: Verify secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add repository secret DATABASE_URL (Supabase session pooler URI). See db/DEPLOY.md"
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add repository secret ANTHROPIC_API_KEY for launch ingest (phenotype + vertical LLM)."
            exit 1
          fi

      - name: Verify Anthropic API key (live ping)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '\r\n' | sed 's/^["'\'']//;s/["'\'']$//')"
          HTTP=$(curl -sS -o /tmp/anthropic-ping.json -w "%{http_code}" \
            https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-haiku-4-5-20251001","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}')
          if [ "$HTTP" != "200" ]; then
            echo "::error::Anthropic API key rejected (HTTP $HTTP). Delete and re-create ANTHROPIC_API_KEY secret — no quotes, no trailing newline."
            cat /tmp/anthropic-ping.json
            exit 1
          fi
          echo "Anthropic API key OK"

      - name: Run launch check (scrape, ingest, refresh)
        id: launch
        continue-on-error: true
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run launches:check:ingest

      - name: Sync to Supabase
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Launch ingest warning
        if: steps.launch.outcome == 'failure'
        run: |
          echo "::warning::Launch ingest failed; Supabase was still refreshed from committed JSON on main. Check logs for siphox-health / API errors."
          exit 1

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check-${{ github.run_id }}
          path: |
            output/launches/check-report.json
            output/launches/reviews.json
            output/launches/rubric.md
            output/launches/logs/
          retention-days: 90
