# Daily YC monitor: directory sync + launches check
# Docs: https://docs.github.com/en/actions
#
# Schedule: every day at 14:00 UTC (~6:00 AM Pacific during PDT).
# Manual run: Actions → "Daily launch check" → Run workflow
#
# Pipeline per run:
#   1. Directory sync — diff all cohort batches on ycombinator.com/companies
#      (Algolia REST, no browser) against the corpus; LLM-classify new
#      companies (capped per run to bound spend).
#   2. Launches check — scrape ycombinator.com/launches for new Launch posts;
#      enrich existing companies, ingest brand-new ones.
#   3. Refresh normalized outputs + explorer bundle.
#   4. Commit results back to main (BEFORE the DB sync, so state survives a
#      migrate timeout) — this advances the diff state so the next run only
#      processes genuinely-new companies. Vercel redeploys off this commit.
#   5. Sync everything to Supabase.
#
# Setup (once): GitHub repo → Settings → Secrets → Actions
#   DATABASE_URL — Supabase session pooler URI (?sslmode=require). See db/DEPLOY.md.
#   ANTHROPIC_API_KEY — required for LLM phenotype + vertical classification.

name: Daily launch check

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-launch-check
  cancel-in-progress: false

jobs:
  check-launches:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install chromium --with-deps

      - name: Verify secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add repository secret DATABASE_URL (Supabase session pooler URI). See db/DEPLOY.md"
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add repository secret ANTHROPIC_API_KEY for launch ingest (phenotype + vertical LLM)."
            exit 1
          fi

      - name: Verify Anthropic API key (live ping)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '\r\n' | sed 's/^["'\'']//;s/["'\'']$//')"
          HTTP=$(curl -sS -o /tmp/anthropic-ping.json -w "%{http_code}" \
            https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-haiku-4-5-20251001","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}')
          if [ "$HTTP" != "200" ]; then
            echo "::error::Anthropic API key rejected (HTTP $HTTP). Delete and re-create ANTHROPIC_API_KEY secret — no quotes, no trailing newline."
            cat /tmp/anthropic-ping.json
            exit 1
          fi
          echo "Anthropic API key OK"

      - name: Directory sync (new companies from batch directory)
        id: dirsync
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/sync-directory.mjs --limit 40

      - name: Launch check (scrape + ingest)
        id: launch
        continue-on-error: true
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/check-launches.mjs --ingest --ingest-new

      - name: Refresh normalized outputs + explorer bundle
        if: always()
        run: |
          node normalize-verticals.mjs --write
          node scripts/build-explorer-data.mjs

      - name: Commit daily results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/launches/ output/corpus/ output/verticals/ \
                  output/phenotypes/assignments.json output/phenotypes/ontology.json \
                  output/whitespace/ explorer/public/data.bundle.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily directory sync + launch check (automated)"
            git pull --rebase origin main || { git rebase --abort; git pull -X ours origin main; }
            git push
          fi

      - name: Sync to Supabase
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Step outcome warnings
        if: steps.dirsync.outcome == 'failure' || steps.launch.outcome == 'failure'
        run: |
          if [ "${{ steps.dirsync.outcome }}" = "failure" ]; then
            echo "::warning::Directory sync failed; launches + Supabase still refreshed. Check logs."
          fi
          if [ "${{ steps.launch.outcome }}" = "failure" ]; then
            echo "::warning::Launch ingest failed; directory sync + Supabase still refreshed. Check logs."
          fi
          exit 1

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check-${{ github.run_id }}
          path: |
            output/launches/check-report.json
            output/launches/reviews.json
            output/launches/rubric.md
            output/launches/logs/
            output/corpus/directory-sync-state.json
          retention-days: 90
