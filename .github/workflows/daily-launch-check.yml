# Daily YC Launches monitor
# Docs: https://docs.github.com/en/actions
#
# Schedule: every day at 14:00 UTC (~6:00 AM Pacific during PDT).
# Manual run: Actions → "Daily launch check" → Run workflow
#
# Setup (once): GitHub repo → Settings → Secrets → Actions → DATABASE_URL
#   Use the Supabase session pooler URI (?sslmode=require). See db/DEPLOY.md.

name: Daily launch check

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  check-launches:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install chromium --with-deps

      - name: Verify DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add repository secret DATABASE_URL (Supabase session pooler URI). See db/DEPLOY.md"
            exit 1
          fi

      - name: Run launch check (scrape, ingest, refresh)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npm run launches:check:ingest

      - name: Sync to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check-${{ github.run_id }}
          path: |
            output/launches/check-report.json
            output/launches/reviews.json
            output/launches/rubric.md
            output/launches/logs/
          retention-days: 90
